services:
  - type: web
    name: mini-project-1-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: DATA_DIR
        value: /tmp/data
      - key: UPLOAD_DIR
        value: /tmp/data/uploads
      - key: DB_PATH
        value: /tmp/data/civicvision.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: mini-project-1-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: mini-project-1-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: CAPACITOR_BUILD
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: mini-project-1-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
